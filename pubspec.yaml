name: aztec_app
description: AztecApp Explorer — sitios mexicas de la CDMX para viajeros independientes.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Única dependencia de red. Deliberado: sin dio, sin retrofit, sin
  # build_runner. La capa de datos son cuatro archivos que se leen de una
  # sentada, y no hay un paso de codegen que se pueda quedar desincronizado.
  http: ^1.2.2
  # Keychain en iOS, Keystore en Android. Aquí van los tokens de sesión, y no en
  # shared_preferences: el token de refresco vive 90 días y con él se piden
  # tokens de acceso nuevos sin contraseña, así que a efectos prácticos ES la
  # contraseña. shared_preferences lo dejaría en un fichero en claro dentro del
  # sandbox de la app, legible con root o jailbreak y en copias de seguridad sin
  # cifrar.
  #
  # Se fija la 9.x y no la 10: la 10 subió el suelo de Android y de AGP, y no
  # hace falta nada de lo que trae.
  #
  # OJO, Android: `encryptedSharedPreferences: true` exige minSdkVersion 23. Si
  # android/app/build.gradle está por debajo, la compilación falla con un error
  # de manifest merger que no menciona este paquete por ningún lado.
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Las dos tipografías del diseño: Playfair Display para los títulos, Inter
  # para todo lo demás.
  #
  # Empaquetadas y no por el paquete `google_fonts`, a propósito: esta app se
  # usa caminando por el Centro con mala señal, y `google_fonts` las descarga en
  # el primer arranque. Hasta que terminara, la app enseñaría la tipografía del
  # sistema; sin datos, nunca.
  #
  # Los .ttf NO están en git —son binarios que no cambian nunca— y se traen con:
  #
  #     bash tools/traer-fuentes.sh
  #
  # SIN ESE PASO `flutter run` NO COMPILA: falla con "unable to locate asset
  # entry", que no dice qué archivo falta.
  #
  # Son fuentes variables: un archivo cubre todos los pesos, y Flutter elige el
  # eje a partir de `fontWeight`.
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
